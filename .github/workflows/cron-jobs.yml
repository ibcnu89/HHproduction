name: HHproduction Cron Jobs

on:
  schedule:
    # Daily health check - 6 AM UTC
    - cron: '0 6 * * *'
    # MRR snapshot - midnight UTC
    - cron: '0 0 * * *'
    # Stripe webhook verify - every 15 minutes
    - cron: '*/15 * * * *'
    # Daily outreach batch - Mon-Fri 10 AM UTC
    - cron: '0 10 * * 1-5'
    # Trial expiry notify - 9 AM UTC daily
    - cron: '0 9 * * *'
    # Weekly content publish - Mon 9 AM UTC
    - cron: '0 9 * * 1'
    # DB backup verify - Sun 3 AM UTC
    - cron: '0 3 * * 0'
    # SSL cert check - 1st of month 12 PM UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        type: choice
        options:
          - health-check
          - mrr-snapshot
          - stripe-webhook-verify
          - send-outreach-batch
          - trial-expiry-notify
          - weekly-content-publish
          - db-backup-verify
          - ssl-cert-check

jobs:
  # Daily health check
  health-check:
    if: github.event.schedule == '0 6 * * *' || github.event.inputs.job == 'health-check'
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          curl -sf https://hhproduction-production.up.railway.app/health || exit 1
      - name: Alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 HHproduction Health Check Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*HHproduction Health Check Failed* ❌\nService: https://hhproduction-production.up.railway.app/health"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK }}

  # MRR Snapshot
  mrr-snapshot:
    if: github.event.schedule == '0 0 * * *' || github.event.inputs.job == 'mrr-snapshot'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      with:
        path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install pg stripe --prefix scripts/ops
      - run: node scripts/ops/mrr-snapshot.js

  # Stripe Webhook Verify
  stripe-webhook-verify:
    if: github.event.schedule == '*/15 * * * *' || github.event.inputs.job == 'stripe-webhook-verify'
    runs-on: ubuntu-latest
    steps:
      - name: Verify webhook endpoint
        run: |
          curl -sf https://hhproduction-production.up.railway.app/api/billing/webhook/health || exit 1

  # Daily Outreach Batch
  send-outreach-batch:
    if: github.event.schedule == '0 10 * * 1-5' || github.event.inputs.job == 'send-outreach-batch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      with:
        path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix scripts/ops pg resend
      - run: node scripts/ops/send-outreach-batch.js

  # Trial Expiry Notify
  trial-expiry-notify:
    if: github.event.schedule == '0 9 * * *' || github.event.inputs.job == 'trial-expiry-notify'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      with:
        path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix scripts/ops pg resend
      - run: node scripts/ops/trial-expiry-notify.js

  # Weekly Content Publish
  weekly-content-publish:
    if: github.event.schedule == '0 9 * * 1' || github.event.inputs.job == 'weekly-content-publish'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      with:
        path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix scripts/ops pg
      - run: node scripts/ops/publish-scheduled-content.js

  # DB Backup Verify
  db-backup-verify:
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.job == 'db-backup-verify'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
    steps:
      - name: Run pg_dump and verify
        run: |
          pg_dump $DATABASE_URL | gzip > /tmp/backup_$(date +%F).sql.gz
          test -s /tmp/backup_$(date +%F).sql.gz && echo "Backup OK" || (echo "Backup failed" && exit 1)

  # SSL Cert Check
  ssl-cert-check:
    if: github.event.schedule == '0 12 1 * *' || github.event.inputs.job == 'ssl-cert-check'
    runs-on: ubuntu-latest
    env:
      DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
    steps:
      - name: Check SSL certificate expiry
        run: |
          openssl x509 -enddate -noout -in <(openssl s_client -connect hhproduction-production.up.railway.app:443 -servername hhproduction-production.up.railway.app </dev/null 2>/dev/null) | grep -q "$(date -d '+30 days' +%b\\ %d)" && echo "OK" || (echo "Cert expiring within 30 days" && exit 1)